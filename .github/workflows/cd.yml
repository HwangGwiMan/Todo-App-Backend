name: Backend CD

on:
  push:
    branches: [ main ]
    # 별도 리포지토리이므로 paths 필터 불필요

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # 경로 수정
      
      - name: Build Backend
        # working-directory 제거 (루트 기준이므로)
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: . # 현재 디렉토리 기준
          file: ./Dockerfile # 현재 디렉토리의 Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todoapp-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # - name: Copy docker-compose.yml to EC2
      #   uses: appleboy/scp-action@master
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     source: "docker-compose.yml"
      #     target: "/home/${{ secrets.EC2_USER }}/app"

      - name: Deploy to NCP
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USER }}
          password: ${{ secrets.NCP_PASSWORD }}
          key: ${{ secrets.NCP_SSH_KEY }}
          use_insecure_cipher: true 
          port: 22
          script: |
            cd /${{ secrets.NCP_USER }}/app
            
            # 백엔드 이미지 Pull
            docker compose pull backend
            
            # 백엔드 컨테이너만 재시작
            docker compose up -d --no-deps backend
            
            # 불필요한 이미지 정리
            docker image prune -f

