plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.TodoApp'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	
	// JWT 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	
	// SpringDoc OpenAPI (Swagger UI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	
	// Lombok이 먼저 실행되어야 함
	annotationProcessor 'org.projectlombok:lombok'
	
	// Lombok-MapStruct Binding (필수)
	implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    if (file("test-utils").exists()) {
        testImplementation("com.utils:test-utils:1.0-SNAPSHOT")
    }

}

tasks.named('test') {
    useJUnitPlatform()
    
    // 메모리 설정 최적화 (대폭 증가)
    maxHeapSize = "8g"
    minHeapSize = "2g"
    jvmArgs = [
        '-Xmx8g',
        '-Xms2g',
        '-XX:MaxMetaspaceSize=1g',
        '-XX:+UseG1GC',
        '-XX:G1HeapRegionSize=32m',
        '-XX:+HeapDumpOnOutOfMemoryError',
        '-XX:HeapDumpPath=build/heap-dump.hprof',
        '-XX:+UseStringDeduplication'  // 문자열 중복 제거로 메모리 절약
    ]
    
    // 테스트 프로세스 포크 설정 (더 자주 재시작하여 메모리 정리)
    forkEvery = 20  // 20개 테스트마다 새 프로세스 시작
    maxParallelForks = 1  // 병렬 실행 프로세스 수
    
    // 테스트 실패 시에도 계속 실행
    ignoreFailures = false
    
    // 테스트 후 정리
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nTest Result: ${result.resultType}"
            println "Test Summary: ${result.testCount} tests, " +
                    "${result.successfulTestCount} succeeded, " +
                    "${result.failedTestCount} failed, " +
                    "${result.skippedTestCount} skipped"
        }
    }
}
