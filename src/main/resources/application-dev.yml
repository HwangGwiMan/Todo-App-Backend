# ===================================================================
# Development Profile (개발 환경)
# ===================================================================
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/todoapp
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true  # 쿼리에 주석 추가하여 어떤 작업인지 표시

  web:
    cors:
      allowed-origins: http://localhost:5173
      allowed-methods: GET,POST,PUT,DELETE,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-please-change-this-in-production
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

