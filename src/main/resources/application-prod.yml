# ===================================================================
# Production Profile (운영 환경)
# ===================================================================
spring:
  datasource:
    # 운영 환경에서는 환경변수나 외부 설정 파일을 통해 주입받는 것이 안전합니다.
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    # HikariCP 설정 (연결 풀 최적화)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      # 운영 환경에서는 절대로 update나 create를 사용하지 않습니다.
      # 첫 배포 시에만 update 사용, 이후 validate로 변경
      ddl-auto: validate
    show-sql: false # 성능 보안을 위해 쿼리 로깅 비활성화
    properties:
      hibernate:
        format_sql: false
        # 쿼리 최적화
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  web:
    cors:
      # 운영 프론트엔드 도메인으로 변경 필요
      allowed-origins: ${PROD_FRONTEND_URL}
      allowed-methods: GET,POST,PUT,DELETE,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  # 운영 환경에서는 반드시 강력한 비밀키를 환경변수로 주입해야 합니다.
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000

# 운영 환경에서는 Swagger를 비활성화하거나 보안 설정이 필요할 수 있습니다.
springdoc:
  swagger-ui:
    enabled: false # 보안을 위해 운영에서는 Swagger UI 비활성화 (필요 시 true)

