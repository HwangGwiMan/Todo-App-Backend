spring:
  application:
    name: backend
  profiles:
    active: dev # 기본적으로 dev 프로파일 활성화

  # Common Jackson Configuration (공통)
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  
  # Common JPA Configuration (공통)
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

---
# ===================================================================
# Development Profile (개발 환경)
# ===================================================================
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:mariadb://localhost:3306/todoapp
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  web:
    cors:
      allowed-origins: http://localhost:5173
      allowed-methods: GET,POST,PUT,DELETE,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-please-change-this-in-production
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

---
# ===================================================================
# Production Profile (운영 환경)
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    # 운영 환경에서는 환경변수나 외부 설정 파일을 통해 주입받는 것이 안전합니다.
    url: ${PROD_DB_URL:jdbc:mariadb://prod-db-host:3306/todoapp}
    username: ${PROD_DB_USERNAME:root}
    password: ${PROD_DB_PASSWORD:password}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 운영 환경에서는 절대로 update나 create를 사용하지 않습니다.
      ddl-auto: validate
    show-sql: false # 성능 보안을 위해 쿼리 로깅 비활성화
    properties:
      hibernate:
        format_sql: false

  web:
    cors:
      # 운영 프론트엔드 도메인으로 변경 필요
      allowed-origins: ${PROD_FRONTEND_URL:https://your-domain.com}
      allowed-methods: GET,POST,PUT,DELETE,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

jwt:
  # 운영 환경에서는 반드시 강력한 비밀키를 환경변수로 주입해야 합니다.
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000

# 운영 환경에서는 Swagger를 비활성화하거나 보안 설정이 필요할 수 있습니다.
springdoc:
  swagger-ui:
    enabled: false # 보안을 위해 운영에서는 Swagger UI 비활성화 (필요 시 true)

